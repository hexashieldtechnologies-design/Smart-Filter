openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vault
    description: Test vault document operations
  - name: smart-fill
    description: Screenshot analysis for user-reviewed Smart Fill
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /vault/documents:
    get:
      operationId: listVaultDocuments
      tags: [vault]
      summary: List documents in a device vault
      parameters:
        - name: ownerKey
          in: query
          required: true
          schema:
            type: string
            minLength: 8
      responses:
        "200":
          description: Vault documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VaultDocument"
  /vault/documents/{documentId}:
    put:
      operationId: upsertVaultDocument
      tags: [vault]
      summary: Save a document in a device vault
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultDocumentInput"
      responses:
        "200":
          description: Saved vault document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultDocument"
    delete:
      operationId: deleteVaultDocument
      tags: [vault]
      summary: Delete a document from a device vault
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultDocumentDeleteInput"
      responses:
        "204":
          description: Document deleted
  /smart-fill/analyze-screenshot:
    post:
      operationId: analyzeSmartFillScreenshot
      tags: [smart-fill]
      summary: Analyze a screenshot and return a reviewable paste plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmartFillScreenshotInput"
      responses:
        "200":
          description: Screenshot analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartFillScreenshotAnalysis"
        "400":
          description: Invalid screenshot
        "502":
          description: Analysis provider failure
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VaultDocument:
      type: object
      required: [id, type, label, status, identifier, updated, icon, color]
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [Verified, "Not added", Processing]
        identifier:
          type: string
        updated:
          type: string
        icon:
          type: string
        color:
          type: string
          enum: [aqua, gold, navy, coral]
        imageData:
          type: ["string", "null"]
        contentType:
          type: ["string", "null"]
    VaultDocumentInput:
      type: object
      required: [ownerKey, type, label, status, identifier, updated, icon, color]
      properties:
        ownerKey:
          type: string
          minLength: 8
        type:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [Verified, "Not added", Processing]
        identifier:
          type: string
        updated:
          type: string
        icon:
          type: string
        color:
          type: string
          enum: [aqua, gold, navy, coral]
        imageData:
          type: ["string", "null"]
        contentType:
          type: ["string", "null"]
    VaultDocumentDeleteInput:
      type: object
      required: [ownerKey]
      properties:
        ownerKey:
          type: string
          minLength: 8
    SmartFillScreenshotInput:
      type: object
      required: [imageBase64, mimeType]
      properties:
        imageBase64:
          type: string
          minLength: 16
          maxLength: 10000000
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        context:
          type: string
          maxLength: 500
    SmartFillScreenshotField:
      type: object
      required: [key, label, controlType, required, confidence, visibleValue, pasteInstruction, sensitive]
      properties:
        key: { type: string }
        label: { type: string }
        controlType: { type: string }
        required: { type: boolean }
        confidence: { type: number, minimum: 0, maximum: 100 }
        visibleValue: { type: string }
        pasteInstruction: { type: string }
        sensitive: { type: boolean }
    SmartFillScreenshotPlacement:
      type: object
      required: [fieldKey, targetLabel, controlType, instruction, confidence]
      properties:
        fieldKey: { type: string }
        targetLabel: { type: string }
        controlType: { type: string }
        instruction: { type: string }
        confidence: { type: number, minimum: 0, maximum: 100 }
    SmartFillScreenshotAnalysis:
      type: object
      required: [screenSummary, formTitle, fields, placements, manualActions]
      properties:
        screenSummary: { type: string }
        formTitle: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/SmartFillScreenshotField" }
        placements:
          type: array
          items: { $ref: "#/components/schemas/SmartFillScreenshotPlacement" }
        manualActions:
          type: array
          items: { type: string }

